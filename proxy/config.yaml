# Consilium LiteLLM proxy — mixed Tier-A/Tier-B free-LLM pool.
# Secrets are referenced via os.environ/* and loaded from ~/.config/consilium/.env.
# model_info fields read by the council:
#   privacy_tier    — A (inference provider does not train/retain) | B (public prompts only).
#                     Follows the INFERENCE PROVIDER, not the weights' origin.
#   scores          — per-capability strength 1-5 (reasoning | code | fast | general).
#   provider_family — diversity key for auto-composition: the WEIGHTS family (openai, qwen,
#                     meta, ...), so a council mixes model lineages, not just API vendors.
#   rpd / tpd       — daily caps tracked by the usage store (exhausted members are skipped).
#   reasoning_effort — true when this MEMBER accepts an explicit reasoning_effort parameter.
#                     A property of the member, never of the weights or the vendor: probed
#                     2026-11-03, Groq accepts it, while Cloudflare's OpenAI-compat shim and
#                     Mistral answer HTTP 400 litellm.UnsupportedParamsError for the very same
#                     gpt-oss-120b weights. Flag only what has been probed. The council sends
#                     "medium" for reasoning work and "low" otherwise, NEVER "high": high
#                     spends the whole budget on hidden thinking and returns an empty answer
#                     below an 8192-token budget (and 16384 trips Groq's per-minute cap).
#   max_tokens      — per-member completion budget, overriding the council's defaults
#                     (4096, or 8192 for a member that accepts a reasoning effort).
#
# Pool refreshed 2026-11-02 against live catalogs (see docs/superpowers/STATUS.md):
#   - Cerebras: free tier closed (HTTP 402 on every model) -> members removed. If you have a
#     paid Cerebras plan, re-add `cerebras/gpt-oss-120b` / `cerebras/qwen-3.8-27b` as Tier A.
#   - GitHub Models: service fully retired 2026-07-30 -> members removed.
#   - Groq: llama-3.3-70b-versatile withdrawn -> replaced by gpt-oss-20b + qwen3.8-27b.
#   - SambaNova: members removed until a valid key is configured (old key rejected).
model_list:
  # ---------------- Tier A — Groq (no-train free tier; 7-day ops logs unless ZDR) --------------
  - model_name: council/groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
    model_info:
      privacy_tier: A
      provider_family: openai
      scores: {reasoning: 4, code: 4, general: 4, fast: 4}
      rpd: 1000
      reasoning_effort: true
  - model_name: council/groq-gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
    model_info:
      privacy_tier: A
      provider_family: openai
      scores: {fast: 5, general: 3, code: 3}
      rpd: 1000
      reasoning_effort: true
  - model_name: council/groq-qwen3.8-27b
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
    model_info:
      privacy_tier: A
      provider_family: qwen
      scores: {reasoning: 4, code: 4, general: 4, fast: 4}
      rpd: 1000
      reasoning_effort: true
  # ---------------- Tier A — Cloudflare Workers AI (OpenAI-compat shim; free plan) -----------
  # Workers AI free plan = 10k neurons/day account-wide; tpd below is a per-alias proxy for it.
  - model_name: council/cloudflare-gpt-oss-120b
    litellm_params:
      model: openai/@cf/openai/gpt-oss-120b
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_TOKEN
    model_info:
      privacy_tier: A
      provider_family: openai
      scores: {reasoning: 4, code: 4, general: 4}
      tpd: 10000
  - model_name: council/cloudflare-qwen3.8-27b
    litellm_params:
      model: openai/@cf/qwen/qwen3.8-27b
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_TOKEN
    model_info:
      privacy_tier: A
      provider_family: qwen
      scores: {reasoning: 4, code: 4, general: 4}
      tpd: 10000
      timeout: 60  # thinking model; see spec Part D
  - model_name: council/cloudflare-glm-4.7-flash
    litellm_params:
      model: openai/@cf/zai-org/glm-4.7-flash
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_TOKEN
    model_info:
      privacy_tier: A
      provider_family: zai
      # Thinking model: ~5 s on short prompts, can exceed the 30 s call timeout on long
      # ones -> kept out of reasoning councils; useful as lineage diversity on general.
      scores: {general: 3, code: 3}
      tpd: 10000
      timeout: 60  # thinking model; see spec Part D
  - model_name: council/cloudflare-llama-70b
    litellm_params:
      model: openai/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_TOKEN
    model_info:
      privacy_tier: A
      provider_family: meta
      scores: {general: 3, fast: 3}
      tpd: 10000
  - model_name: council/cloudflare-llama-4-scout
    litellm_params:
      model: openai/@cf/meta/llama-4-scout-17b-16e-instruct
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_TOKEN
    model_info:
      privacy_tier: A
      provider_family: meta
      scores: {fast: 4, general: 3}
      tpd: 10000
  - model_name: council/cloudflare-qwen-coder-32b
    litellm_params:
      model: openai/@cf/qwen/qwen2.5-coder-32b-instruct
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_TOKEN
    model_info:
      privacy_tier: A
      provider_family: qwen
      scores: {code: 4, fast: 3}
      tpd: 10000
  - model_name: council/cloudflare-nemotron-120b
    litellm_params:
      model: openai/@cf/nvidia/nemotron-3-120b-a12b
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_TOKEN
    model_info:
      privacy_tier: A
      provider_family: nvidia
      scores: {general: 3, reasoning: 3}
      tpd: 10000
  # ---------------- Tier B — free tier trains/retains or undocumented => public only --------
  # Mistral free "experiment" plan is ~1 request/second -> rpm 1 keeps the fan-out polite.
  - model_name: council/mistral-large-4
    litellm_params:
      model: mistral/mistral-large-4
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 1
    model_info:
      privacy_tier: B
      provider_family: mistral
      scores: {reasoning: 4, general: 4, code: 4}
  - model_name: council/mistral-codestral
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 1
    model_info:
      privacy_tier: B
      provider_family: mistral
      scores: {code: 5, fast: 4, general: 3}
  # NVIDIA NIM — dormant until NVIDIA_NIM_API_KEY is set (key-presence activation).
  - model_name: council/nvidia-deepseek-r1
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-r1
      api_key: os.environ/NVIDIA_NIM_API_KEY
      rpm: 10
    model_info:
      privacy_tier: B
      provider_family: deepseek
      scores: {reasoning: 5, general: 3}
  - model_name: council/nvidia-llama-70b
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_NIM_API_KEY
      rpm: 10
    model_info:
      privacy_tier: B
      provider_family: meta
      scores: {general: 3, code: 3, fast: 4}
router_settings:
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 30
  retry_policy:
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 2
    RateLimitErrorRetries: 0
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  # No proxy-level fallbacks: the council owns failover (ask walks the ranked list,
  # council drops a failed voter); a proxy fallback would hide a dead member behind a 200.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
